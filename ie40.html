th": 603}, {"number": 9, "title": "화학·지구과학 · 데이터베이스 설계", "labels": ["09. 화학·지구과학", "09. 화학·지구과학", "16. 데이터베이스 설계", "09. 화학·지구과학"], "text": "화학과 지구과학의 다양한 자연 현상을 정보기술로 해석하는 데 관심을 보이며, 관측 자료와 수치 정보를 체계적으로 정리하고 프로그래밍을 활용하여 변화 양상과 상호 관계를 분석하는 융합적 탐구 태도를 보임. 화학 반응과 지구과학적 현상에서 나타나는 수치적 관계를 정보과학적으로 분석하는 탐구에 참여함. 온도와 농도, 기압과 강수량 등 관측 변수의 특성을 분석하고 자료의 단위와 측정 조건을 고려하여 데이터를 구조화함. 실생활의 정보 관리 문제를 해결하기 위해 관계형 데이터베이스의 구조와 테이블 설계 원리를 탐구함. 자료의 속성을 분석하여 적절한 자료형을 지정하고 기본키와 외래키를 활용하여 테이블 사이의 관계를 구성함. 데이터 입력과 조회, 수정 및 삭제 명령을 활용하여 자료를 관리하고 제약조건을 통해 무결성을 검증함. 중복 자료와 참조 오류가 발생하는 사례를 분석하여 테이블 구조를 개선하고 효율적이고 일관된 데이터 관리 방법을 설명함. 화학과 지구과학의 다양한 현상을 수치 자료와 프로그램으로 분석하여 자연 현상의 규칙성을 탐색하였으며, 자료 사이의 관계를 과학적으로 해석하고 분석 결과를 다른 교과의 개념과 연결하는 융합적 문제 해결 능력이 돋보임.", "length": 590}, {"number": 10, "title": "창의적 문제 해결 · 데이터베이스 질의", "labels": ["10. 창의적 문제 해결", "10. 창의적 문제 해결", "17. 데이터베이스 질의", "10. 창의적 문제 해결"], "text": "수학적 규칙과 정보과학적 문제 해결 원리를 결합한 창의적 탐구에 적극적으로 참여하며, 복잡한 문제의 조건을 분석하고 여러 해결 전략을 비교하여 논리적이고 효율적인 해결 절차를 구성하는 능력을 드러냄. 창의력 경진대회 유형의 수학·정보 융합 문제를 분석하여 핵심 조건과 제한 사항을 구체화함. 복잡한 문제를 작은 단위로 분해하고 완전 탐색과 가지치기, 재귀 및 반복 구조의 적용 가능성을 비교함. 관계형 데이터베이스에 저장된 자료를 활용하여 탐구 목적에 적합한 정보를 추출하고 분석함. 조건 검색과 정렬, 집계 함수를 활용하여 필요한 자료를 조회하고 그룹별 통계량을 계산함. 여러 테이블의 관계를 분석하여 결합 조건을 설정하고 조회 결과의 중복과 누락 여부를 검증함. 질의 조건을 변화시키며 결과의 차이를 비교하고 데이터베이스 분석 결과를 통계 및 시각화 활동과 연결하여 자료에 근거한 결론을 도출하는 과정을 탐구함. 복잡한 수학 문제의 조건을 체계적으로 분석하고 다양한 알고리즘의 적용 가능성을 비교하였으며, 해결 과정에서 발견한 오류를 수정하고 보다 효율적인 방법을 탐색하는 등 끈기 있는 탐구 태도와 창의적 문제 해결 역량을 보여 줌.", "length": 581}, {"number": 11, "title": "파이썬 프로그래밍 · 기상·환경·공공데이터", "labels": ["11. 파이썬 프로그래밍", "11. 파이썬 프로그래밍", "18. 기상·환경·공공데이터", "11. 파이썬 프로그래밍"], "text": "파이썬 프로그래밍을 활용하여 실생활 문제를 해결하는 탐구 활동에 관심을 보이며, 문제를 입력과 처리 및 출력 단계로 분해하고 변수와 함수, 조건문과 반복문을 적절히 활용하여 해결 절차를 설계하는 컴퓨팅 사고력을 드러냄. 파이썬 기초학습과 심화 프로그래밍 활동에서 변수와 자료형, 조건문, 반복문 및 함수의 역할을 이해하고 이를 활용하여 문제 해결 프로그램을 구현함. 입력 자료의 형식과 처리 조건을 분석하여 알고리즘을 설계하고 리스트와 딕셔너리 등 적절한 자료구조를 선택함. 실행 결과를 예측한 뒤 실제 출력과 비교하여 오류를 수정하고 함수의 역할을 분리하여 코드의 가독성을 개선함. 다양한 입력 사례를 검증하며 프로그램의 정확성과 재사용성을 높이는 방법을 탐구함. 전국 기상 관측 자료와 미세먼지 농도, 지역별 인구 자료를 활용하여 지역 간 차이와 시간에 따른 변화 양상을 탐구함. 공공데이터의 수집 시점과 측정 단위, 누락 여부를 확인하고 분석 목적에 맞게 자료를 정제함. 문제 해결에 필요한 기능을 함수와 자료구조로 체계화하고 프로그램의 실행 결과를 검증하였으며, 정상·경계·예외 상황에서 발생하는 오류를 분석하고 수정하는 과정을 통해 프로그래밍의 정확성과 완성도를 높이는 역량을 보여 줌.", "length": 613}, {"number": 12, "title": "객체지향 프로그램 · 융합 프로젝트·협업", "labels": ["12. 객체지향 프로그램", "12. 객체지향 프로그램", "19. 융합 프로젝트·협업", "12. 객체지향 프로그램"], "text": "객체지향 프로그래밍의 핵심 원리를 실제 문제 해결에 적용하는 탐구에 흥미를 보이며, 클래스와 객체의 관계를 분석하고 속성과 메서드를 체계적으로 구성하여 프로그램의 재사용성과 확장성을 고려하는 설계 역량을 보여 줌. 객체지향 프로그래밍의 원리를 활용하여 학습용 퀴즈 프로그램의 구조를 설계함. 문제와 정답, 배점 등의 정보를 객체의 속성으로 정의하고 문제 출제와 정답 판정, 점수 계산 기능을 메서드로 구현함. 클래스 사이의 역할을 구분하여 프로그램의 중복 코드를 줄이고 새로운 문제 유형을 추가할 수 있도록 구조를 개선함. 정답과 오답, 입력 오류 등 다양한 상황을 검증하여 프로그램의 안정성을 점검하고 학습 도구로서의 활용 가능성을 분석함. 수학과 과학, 인문학의 개념을 활용하여 실생활에서 해결할 가치가 있는 문제를 발견하고 탐구 질문과 목표를 구체화함. 문제 해결에 필요한 자료를 수집하고 기능별 역할을 분담하여 알고리즘과 프로그램의 구조를 설계함. 클래스와 객체의 역할을 명확하게 구분하고 프로그램의 기능을 모듈화하여 유지보수와 확장 가능성을 높였으며, 객체 사이의 상호작용을 논리적으로 설계하고 구현 결과를 반복적으로 개선하는 체계적인 프로그래밍 역량이 돋보임.", "length": 599}, {"number": 13, "title": "정렬 알고리즘 · 자기주도적 심화 탐구", "labels": ["13. 정렬 알고리즘", "13. 정렬 알고리즘", "20. 자기주도적 심화 탐구", "13. 정렬 알고리즘"], "text": "정렬 알고리즘의 동작 원리와 효율성을 비교하는 탐구에 적극적으로 참여하며, 자료의 이동과 비교 과정을 시각적으로 분석하고 입력 자료의 크기와 특성에 따른 실행 과정의 차이를 논리적으로 설명하는 문제 해결 역량을 드러냄. 버블 정렬과 선택 정렬, 삽입 정렬 등 여러 정렬 알고리즘의 동작 과정을 분석하고 자료의 비교와 이동 과정을 시각화함. 동일한 입력 자료에 각 알고리즘을 적용하여 비교 횟수와 교환 횟수를 기록하고 자료의 크기와 초기 정렬 상태에 따른 차이를 분석함. 정렬 결과의 정확성을 검증하고 시간 복잡도에 관한 이론적 설명과 실험 결과를 비교함. 정보융합탐구의 전 과정에서 관심 분야를 바탕으로 탐구 주제를 선정하고 연구 질문과 가설을 구체화함. 자료 수집과 전처리, 알고리즘 설계, 프로그램 구현 및 결과 분석을 단계적으로 수행하고 탐구 과정을 기록함. 정상·경계·예외 상황을 검증하여 오류의 원인을 추적하고 프로그램과 분석 방법을 개선함. 여러 정렬 알고리즘의 비교와 교환 과정을 시각화하고 입력 자료의 특성에 따른 실행 효율성을 분석하였으며, 알고리즘의 시간 복잡도와 실제 실행 결과를 연결하여 해석하는 등 근거 중심의 문제 해결 역량을 드러냄.", "length": 593}, {"number": 14, "title": "데이터 과학·통계 · 수학·정보 융합", "labels": ["14. 데이터 과학·통계", "14. 데이터 과학·통계", "01. 수학·정보 융합", "14. 데이터 과학·통계"], "text": "실생활에서 수집한 자료를 통계적 관점에서 해석하는 활동에 관심을 보이며, 자료의 정확성과 신뢰성을 검토하고 평균과 중앙값, 분포 등의 통계적 특성을 분석하여 근거 중심의 결론을 th": 598}, {"number": 17, "title": "데이터베이스 질의 · 인문학·정보기술", "labels": ["17. 데이터베이스 질의", "17. 데이터베이스 질의", "04. 인문학·정보기술", "17. 데이터베이스 질의"], "text": "관계형 데이터베이스를 활용한 정보 검색과 분석에 흥미를 보이며, 조건 검색과 집계 및 테이블 결합의 원리를 탐구하고 여러 자료 사이의 관계를 분석하여 탐구 목적에 적합한 정보를 추출하는 논리적 사고력을 드러냄. 관계형 데이터베이스에 저장된 자료를 활용하여 탐구 목적에 적합한 정보를 추출하고 분석함. 조건 검색과 정렬, 집계 함수를 활용하여 필요한 자료를 조회하고 그룹별 통계량을 계산함. 여러 테이블의 관계를 분석하여 결합 조건을 설정하고 조회 결과의 중복과 누락 여부를 검증함. 질의 조건을 변화시키며 결과의 차이를 비교하고 데이터베이스 분석 결과를 통계 및 시각화 활동과 연결하여 자료에 근거한 결론을 도출하는 과정을 탐구함. 철학과 인문학의 주요 개념을 정보과학의 문제 해결 과정과 연결하여 인간의 사고와 컴퓨터의 정보 처리 방식을 비교함. 노자의 사상과 인간관계에 관한 철학적 질문을 탐구 주제로 설정하고 추상적인 개념을 조건과 규칙으로 구조화함. 조건 검색과 집계 및 테이블 결합을 활용하여 탐구 목적에 적합한 정보를 추출하고 분석하였으며, 질의 결과의 정확성을 검증하고 여러 자료 사이의 관계를 논리적으로 해석하는 등 데이터 기반 문제 해결 역량을 보여 줌.", "length": 599}, {"number": 18, "title": "기상·환경·공공데이터 · 문학·프로그래밍", "labels": ["18. 기상·환경·공공데이터", "18. 기상·환경·공공데이터", "05. 문학·프로그래밍", "18. 기상·환경·공공데이터"], "text": "기상 변화와 대기환경 및 지역별 인구 현상을 정보과학적 관점에서 탐구하며, 공공데이터의 수집과 전처리 과정을 이해하고 시각화 결과를 바탕으로 지역별 특성과 변화 양상을 비교하는 사회 문제 해결 역량을 보여 줌. 전국 기상 관측 자료와 미세먼지 농도, 지역별 인구 자료를 활용하여 지역 간 차이와 시간에 따른 변화 양상을 탐구함. 공공데이터의 수집 시점과 측정 단위, 누락 여부를 확인하고 분석 목적에 맞게 자료를 정제함. 어린 왕자, 위대한 유산, 톰 소여의 모험 등 문학 작품의 서사 구조를 프로그래밍 개념과 연결하여 탐구함. 등장인물의 속성과 행동을 변수와 함수로 표현하고 사건의 전개를 조건문과 반복문으로 구조화함. 인물 사이의 관계를 자료구조로 정리하고 이야기의 진행에 따라 프로그램의 상태가 변화하는 과정을 구현함. 문학적 상황을 알고리즘으로 표현할 때 발생하는 단순화의 한계를 분석하고 인문학적 해석과 컴퓨팅 사고의 공통점과 차이점을 설명함. 기상과 대기환경 및 지역별 인구 자료를 분석하여 실생활 문제와 연결되는 의미 있는 결과를 도출하였으며, 공공데이터의 신뢰성과 분석의 한계를 검토하고 사회적 문제 해결에 정보기술을 활용하려는 실천적 탐구 태도가 돋보임.", "length": 599}, {"number": 19, "title": "융합 프로젝트·협업 · 철학·객체지향", "labels": ["19. 융합 프로젝트·협업", "19. 융합 프로젝트·협업", "06. 철학·객체지향", "19. 융합 프로젝트·협업"], "text": "수학과 과학, 인문학의 다양한 개념을 정보기술과 연결하는 융합 프로젝트에 관심을 보이며, 탐구 문제를 구체화하고 역할 분담과 협업을 통해 해결 방안을 설계하며 다양한 관점을 종합하는 창의적 문제 해결 태도를 드러냄. 수학과 과학, 인문학의 개념을 활용하여 실생활에서 해결할 가치가 있는 문제를 발견하고 탐구 질문과 목표를 구체화함. 문제 해결에 필요한 자료를 수집하고 기능별 역할을 분담하여 알고리즘과 프로그램의 구조를 설계함. 협업 과정에서 의견을 비교하고 수정 사항을 기록하며 구현 결과를 반복적으로 검증함. 탐구 산출물을 발표하고 다른 구성원의 의견을 반영하여 개선 방향을 제시하며 협업을 통한 융합적 문제 해결 과정을 체계적으로 정리함. 객체지향 프로그래밍의 추상화, 캡슐화, 상속, 다형성 개념을 탐구하고 이를 철학적 분류와 개념 체계에 연결함. 등장인물이나 실생활 사물을 클래스로 정의하고 속성과 메서드를 구분하여 객체 사이의 상호작용을 구현함. 탐구 과정에서 구성원과 의견을 조율하고 역할을 분담하여 공동의 문제 해결에 기여하였으며, 수학과 과학 및 인문학의 지식을 정보기술과 연결하여 결과물을 완성하고 탐구 성과를 논리적으로 공유하는 협업 역량을 보여 줌.", "length": 599}, {"number": 20, "title": "자기주도적 심화 탐구 · 물리학·모의실험", "labels": ["20. 자기주도적 심화 탐구", "20. 자기주도적 심화 탐구", "07. 물리학·모의실험", "20. 자기주도적 심화 탐구"], "text": "정보융합탐구의 전 과정에서 스스로 학습 목표를 설정하고 탐구 방법을 구체화하는 태도를 보이며, 프로그램 구현과 검증 과정에서 발견한 오류와 한계를 분석하고 개선 방향을 모색하며 자기주도적 탐구 역량을 발전시킴. 정보융합탐구의 전 과정에서 관심 분야를 바탕으로 탐구 주제를 선정하고 연구 질문과 가설을 구체화함. 자료 수집과 전처리, 알고리즘 설계, 프로그램 구현 및 결과 분석을 단계적으로 수행하고 탐구 과정을 기록함. 물리학의 운동과 힘에 관한 개념을 수학적 모형으로 표현하고 파이썬을 활용하여 물체의 운동을 모의실험함. 시간에 따른 위치와 속도, 가속도의 변화를 함수로 구현하고 계산 결과를 그래프로 시각화함. 초기 속도와 중력가속도 등의 조건을 변화시키며 운동 궤적의 차이를 분석함. 이론적 계산값과 모의실험 결과를 비교하고 공기 저항을 무시하는 등의 모형 가정이 결과에 미치는 영향을 검토하여 과학적 모형의 적용 범위와 한계를 설명함. 탐구 주제 선정부터 자료 수집과 분석, 프로그램 구현 및 결과 검증에 이르는 전 과정을 성찰하였으며, 발견한 문제점의 원인을 분석하고 개선 방향을 스스로 모색하여 학습 내용을 새로운 탐구 주제로 확장하는 자기주도적 역량이 돋보임.", "length": 600}, {"number": 21, "title": "수학·정보 융합 · 객체지향 프로그램", "labels": ["01. 수학·정보 융합", "01. 수학·정보 융합", "12. 객체지향 프로그램", "06. 철학·객체지향"], "text": "수학적 개념을 정보기술과 연결하여 탐구하는 과정에서 지적 호기심을 보이며, 추상적인 수학 원리를 계산 가능한 문제로 구체화하고 파이썬 프로그래밍을 활용하여 해결 방법을 탐색하는 융합적 사고력을 드러냄. 수학적 개념을 프로그래밍으로 구현하는 탐구에서 함수의 정의역과 치역, 그래프의 변화 및 변수 사이의 관계를 분석함. 수학 문제를 입력·처리·출력 단계로 분해하고 파이썬의 함수와 반복문을 활용하여 계산 과정을 구현함. 객체지향 프로그래밍의 원리를 활용하여 학습용 퀴즈 프로그램의 구조를 설계함. 문제와 정답, 배점 등의 정보를 객체의 속성으로 정의하고 문제 출제와 정답 판정, 점수 계산 기능을 메서드로 구현함. 클래스 사이의 역할을 구분하여 프로그램의 중복 코드를 줄이고 새로운 문제 유형을 추가할 수 있도록 구조를 개선함. 정답과 오답, 입력 오류 등 다양한 상황을 검증하여 프로그램의 안정성을 점검하고 학습 도구로서의 활용 가능성을 분석함. 철학적 사유와 객체지향 프로그래밍의 추상화 원리를 연결하여 대상의 속성과 관계를 체계적으로 분석하였으며, 복잡한 개념을 구조화하고 재사용 가능한 프로그램으로 표현하는 과정에서 논리적 사고력과 창의적 설계 역량을 드러냄.", "length": 596}, {"number": 22, "title": "미적분학 심화 · 정렬 알고리즘", "labels": ["02. 미적분학 심화", "02. 미적분학 심화", "13. 정렬 알고리즘", "07. 물리학·모의실험"], "text": "함수의 변화율과 누적량을 정보과학적 관점에서 해석하는 탐구에 관심을 보이며, 미분과 적분의 수학적 원리를 프로그래밍과 그래프 시각화로 연결하고 다양한 조건에서 결과를 비교하는 분석적 탐구 태도를 보임. 미분과 적분의 수학적 원리를 정보과학적으로 해석하는 탐구에서 함수의 극한과 연속성, 도함수와 정적분의 의미를 분석함. 파이썬을 활용하여 함수의 그래프와 접선의 기울기를 시각화하고 수치적분 결과를 해석적 계산 결과와 비교함. 구간의 분할 수에 따른 근삿값의 변화를 관찰하여 수치 계산의 정확성을 검토함. 변화율과 누적량의 관계를 실생활 현상에 적용하고 계산 결과의 오차와 한계를 분석하여 탐구 내용을 심화함. 버블 정렬과 선택 정렬, 삽입 정렬 등 여러 정렬 알고리즘의 동작 과정을 분석하고 자료의 비교와 이동 과정을 시각화함. 동일한 입력 자료에 각 알고리즘을 적용하여 비교 횟수와 교환 횟수를 기록하고 자료의 크기와 초기 정렬 상태에 따른 차이를 분석함. 물리 현상을 수학적 관계식과 프로그램으로 구현하여 관측 결과와 계산 결과를 비교하고, 변수의 변화가 현상에 미치는 영향을 분석하였으며, 과학적 근거를 바탕으로 모형의 타당성과 한계를 검토하는 탐구 역량이 돋보임.", "length": 599}, {"number": 23, "title": "정수론·알고리즘 · 데이터 과학·통계", "labels": ["03. 정수론·알고리즘", "03. 정수론·알고리즘", "14. 데이터 과학·통계", "08. 생명과학·자료 분석"], "text": "정수의 성질과 수학적 규칙을 알고리즘으로 표현하는 활동에 적극적으로 참여하며, 유클리드 호제법과 중국인의 나머지 정리 등 수학적 원리를 탐구하고 논리적 절차를 통해 해결 과정을 체계화하는 능력을 보여 줌. 정수론의 기본 성질과 나머지 연산을 탐구하며 최대공약수, 피보나치 수열, 중국인의 나머지 정리의 수학적 원리를 분석함. 유클리드 호제법을 반복문과 재귀함수로 각각 구현하고 입력값에 따른 연산 횟수와 실행 과정을 비교함. 데이터 과학 탐구에서 자료의 수집과 정제, 분석 및 해석 과정을 단계적으로 수행함. 판다스를 활용하여 표 형식의 자료를 불러오고 열의 자료형과 결측값, 중복값을 확인하여 전처리 기준을 설정함. 조건별 자료 추출과 그룹별 집계를 통해 주요 통계량을 계산하고 분석 결과의 의미를 해석함. 전처리 전후의 결과를 비교하여 자료 품질이 분석에 미치는 영향을 검토하고 데이터 출처의 신뢰성과 개인정보 보호 원칙을 고려하여 탐구 결과를 정리함. 생명 현상의 특성을 자료로 구조화하고 통계적 분석과 시각화를 통해 변화 양상을 해석하였으며, 분석 결과를 생물학적 개념과 연결하여 설명하고 자료의 신뢰성과 해석의 한계를 함께 고려하는 과학적 탐구 태도를 보여 줌.", "length": 599}, {"number": 24, "title": "인문학·정보기술 · 자료 시각화", "labels": ["04. 인문학·정보기술", "04. 인문학·정보기술", "15. 자료 시각화", "09. 화학·지구과학"], "text": "인문학적 질문을 정보과학의 문제 해결 과정과 연결하는 데 관심을 보이며, 철학적 사고와 논리적 분석을 바탕으로 인간과 기술의 관계를 탐색하고 다양한 관점에서 탐구 주제를 구체화하는 융합적 사고 역량을 드러냄. 철학과 인문학의 주요 개념을 정보과학의 문제 해결 과정과 연결하여 인간의 사고와 컴퓨터의 정보 처리 방식을 비교함. 노자의 사상과 인간관계에 관한 철학적 질문을 탐구 주제로 설정하고 추상적인 개념을 조건과 규칙으로 구조화함. 자료의 특성과 탐구 목적에 적합한 시각화 방법을 선정하고 파이썬의 그래프 작성 기능을 활용하여 분석 결과를 표현함. 시간에 따른 변화는 선그래프, 범주별 비교는 막대그래프, 변수 사이의 관계는 산점도로 나타내어 자료의 특징을 분석함. 축의 범위와 눈금, 범례 및 제목이 정보 전달에 미치는 영향을 검토하고 잘못된 시각화가 해석에 미치는 문제를 분석함. 그래프를 수정하고 개선하는 과정을 통해 정확한 정보 전달 방법을 탐구함. 화학과 지구과학의 다양한 현상을 수치 자료와 프로그램으로 분석하여 자연 현상의 규칙성을 탐색하였으며, 자료 사이의 관계를 과학적으로 해석하고 분석 결과를 다른 교과의 개념과 연결하는 융합적 문제 해결 능력이 돋보임.", "length": 601}, {"number": 25, "title": "문학·프로그래밍 · 데이터베이스 설계", "labels": ["05. 문학·프로그래밍", "05. 문학·프로그래밍", "16. 데이터베이스 설계", "10. 창의적 문제 해결"], "text": "문학 작품의 인물과 사건을 프로그래밍 개념으로 재해석하는 활동에 흥미를 보이며, 소설의 서사 구조와 알고리즘의 실행 과정을 연결하여 추상적인 정보과학 개념을 구체적인 이야기로 표현하는 창의적 사고력을 보여 줌. 어린 왕자, 위대한 유산, 톰 소여의 모험 등 문학 작품의 서사 구조를 프로그래밍 개념과 연결하여 탐구함. 등장인물의 속성과 행동을 변수와 함수로 표현하고 사건의 전개를 조건문과 반복문으로 구조화함. 인물 사이의 관계를 자료구조로 정리하고 이야기의 진행에 따라 프로그램의 상태가 변화하는 과정을 구현함. 문학적 상황을 알고리즘으로 표현할 때 발생하는 단순화의 한계를 분석하고 인문학적 해석과 컴퓨팅 사고의 공통점과 차이점을 설명함. 실생활의 정보 관리 문제를 해결하기 위해 관계형 데이터베이스의 구조와 테이블 설계 원리를 탐구함. 자료의 속성을 분석하여 적절한 자료형을 지정하고 기본키와 외래키를 활용하여 테이블 사이의 관계를 구성함. 복잡한 수학 문제의 조건을 체계적으로 분석하고 다양한 알고리즘의 적용 가능성을 비교하였으며, 해결 과정에서 발견한 오류를 수정하고 보다 효율적인 방법을 탐색하는 등 끈기 있는 탐구 태도와 창의적 문제 해결 역량을 보여 줌.", "length": 598}, {"number": 26, "title": "철학·객체지향 · 데이터베이스 질의", "labels": ["06. 철학·객체지향", "06. 철학·객체지향", "17. 데이터베이스 질의", "11. 파이썬 프로그래밍"], "text": "철학적 개념과 객체지향 프로그래밍의 구조적 특징을 연결하여 탐구하며, 대상의 속성과 행동을 분석하고 객체 사이의 관계를 체계적으로 표현하는 과정에서 추상화 능력과 개념 간 연결 능력을 드러냄. 객체지향 프로그래밍의 추상화, 캡슐화, 상속, 다형성 개념을 탐구하고 이를 철학적 분류와 개념 체계에 연결함. 등장인물이나 실생활 사물을 클래스로 정의하고 속성과 메서드를 구분하여 객체 사이의 상호작용을 구현함. 관계형 데이터베이스에 저장된 자료를 활용하여 탐구 목적에 적합한 정보를 추출하고 분석함. 조건 검색과 정렬, 집계 함수를 활용하여 필요한 자료를 조회하고 그룹별 통계량을 계산함. 여러 테이블의 관계를 분석하여 결합 조건을 설정하고 조회 결과의 중복과 누락 여부를 검증함. 질의 조건을 변화시키며 결과의 차이를 비교하고 데이터베이스 분석 결과를 통계 및 시각화 활동과 연결하여 자료에 근거한 결론을 도출하는 과정을 탐구함. 문제 해결에 필요한 기능을 함수와 자료구조로 체계화하고 프로그램의 실행 결과를 검증하였으며, 정상·경계·예외 상황에서 발생하는 오류를 분석하고 수정하는 과정을 통해 프로그래밍의 정확성과 완성도를 높이는 역량을 보여 줌.", "length": 585}, {"number": 27, "title": "물리학·모의실험 · 기상·환경·공공데이터", "labels": ["07. 물리학·모의실험", "07. 물리학·모의실험", "18. 기상·환경·공공데이터", "12. 객체지향 프로그램"], "text": "물리 현상을 수학적 모델과 프로그래밍으로 분석하는 활동에 관심을 보이며, 운동과 힘의 관계를 변수와 함수로 표현하고 계산 결과를 시각화하여 자연 현상을 정량적으로 해석하려는 과학적 탐구 태도를 보여 줌. 물리학의 운동과 힘에 관한 개념을 수학적 모형으로 표현하고 파이썬을 활용하여 물체의 운동을 모의실험함. 시간에 따른 위치와 속도, 가속도의 변화를 함수로 구현하고 계산 결과를 그래프로 시각화함. 초기 속도와 중력가속도 등의 조건을 변화시키며 운동 궤적의 차이를 분석함. 이론적 계산값과 모의실험 결과를 비교하고 공기 저항을 무시하는 등의 모형 가정이 결과에 미치는 영향을 검토하여 과학적 모형
