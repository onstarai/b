<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 과학 과세특 문장 조합기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#14243b;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;line-height:1.65}.wrap{max-width:1120px;margin:28px auto;padding:0 18px}header{background:linear-gradient(120deg,#15335a,#267b91);color:white;padding:28px 32px;border-radius:18px}h1{margin:0;font-size:26px}header p{margin:8px 0 0;opacity:.9}.panel{background:white;border:1px solid #dbe4ee;border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 4px 18px #19334b0b}h2{font-size:19px;margin:0 0 14px}.field{margin:0 0 15px}label{display:block;font-weight:700;margin-bottom:6px}select,textarea{width:100%;border:1px solid #b8c9db;border-radius:9px;padding:11px;font:inherit;background:white;color:#14243b}select:focus,textarea:focus{outline:2px solid #5aafcc}.preview{font-size:13px;color:#536579;background:#f7f9fc;padding:9px 12px;margin-top:6px;border-radius:8px;max-height:75px;overflow:auto}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button{cursor:pointer;border:0;border-radius:9px;padding:11px 17px;font:inherit;font-weight:700;background:#1a567a;color:white}button.secondary{background:#e8f1f6;color:#234761}button:hover{filter:brightness(.94)}textarea{min-height:250px;resize:vertical}#status{font-weight:700;color:#1a567a}#error{color:#b91c1c;font-weight:700;min-height:22px}.note{font-size:13px;color:#62748a}footer{padding:16px;text-align:center;color:#64748b;font-size:13px}@media(max-width:600px){h1{font-size:21px}.panel{padding:16px}}</style></head><body><main class="wrap"><header><h1>데이터 과학 · 과세특 문장 조합기</h1><p>시작 1개 + 서로 다른 본문 2개 + 마무리 1개 · 총 152,000가지 조합</p></header><section class="panel"><h2>문장 선택</h2><div id="fields"></div><div id="error" role="alert"></div><div class="buttons"><button id="generate">문장 생성</button><button id="copy" class="secondary">결과 복사</button><button id="save" class="secondary">TXT 저장</button><button id="reset" class="secondary">초기화</button><button id="print" class="secondary">인쇄</button></div></section><section class="panel"><h2>생성된 과세특 (직접 수정 가능)</h2><p id="status" aria-live="polite">문장 생성 단추를 누르세요.</p><textarea id="result" placeholder="선택한 문장이 이곳에 표시됩니다. 생성 후 자유롭게 수정할 수 있습니다."></textarea><p class="note">실제 학생의 수행활동과 산출물에 맞게 문장을 검토·수정하세요. TXT는 한글 호환을 위해 UTF-8 BOM으로 저장합니다.</p></section><footer>데이터 과학 과세특 · 원본 Tkinter 파일의 60개 문장 그대로 사용</footer></main><script>
const banks={"시작_멘트": {"1": "데이터 과학이 실생활의 복잡한 문제를 해결하는 과정에 관심을 가지고 다양한 활용 사례를 탐색함. 자료를 근거로 현상을 설명하고 합리적인 의사결정에 도달하는 과정을 이해하며 탐구의 방향을 구체화함.", "2": "일상에서 발생하는 다양한 현상을 수치와 자료로 해석할 수 있다는 점에 주목함. 데이터 과학의 문제 해결 절차를 탐색하고 객관적인 근거를 바탕으로 현상을 설명하기 위한 탐구 질문을 스스로 설정함.", "3": "사회적 현상과 개인의 경험 사이에 나타나는 차이를 데이터로 확인하려는 지적 호기심을 보임. 자료 수집부터 분석과 해석에 이르는 과정을 조사하며 데이터 기반 문제 해결의 필요성과 활용 가능성을 탐구함.", "4": "직관적인 판단과 데이터에 근거한 판단의 차이에 관심을 가지고 실제 사례를 비교함. 문제의 핵심 조건을 분석하고 객관적인 자료를 활용하여 합리적인 결론을 도출하는 탐구 과정의 중요성을 인식함.", "5": "데이터 과학이 과학과 사회 및 산업 분야의 문제 해결에 활용되는 사례를 탐색함. 다양한 분야에서 자료가 의사결정의 근거로 작용하는 과정을 비교하고 데이터 분석을 통한 새로운 문제 발견에 관심을 보임.", "6": "실생활 자료의 수집과 정제 과정이 분석 결과의 신뢰성에 미치는 영향을 탐구함. 자료에 포함된 결측값과 이상값의 특징을 살펴보고 정확한 분석을 위한 데이터 준비 절차와 처리 기준을 구체적으로 탐색함.", "7": "다양한 자료에서 의미 있는 규칙과 경향을 발견하는 과정에 관심을 가지고 기초 통계량의 활용 방법을 탐구함. 평균과 중앙값 및 산포도의 차이를 비교하며 자료의 특성을 객관적으로 설명하려는 태도를 보임.", "8": "데이터를 그래프로 표현하면 복잡한 현상의 특징을 쉽게 파악할 수 있다는 점에 주목함. 자료의 종류와 분석 목적에 적합한 시각화 방법을 비교하고 그래프에 나타난 변화와 분포를 해석하는 활동에 관심을 보임.", "9": "공공데이터를 활용하여 지역사회와 관련된 문제를 탐구하려는 관심을 보임. 자료의 수집 경로와 신뢰성을 확인하고 분석 목적에 적합한 항목을 선정하며 자료를 체계적으로 정리하는 과정의 중요성을 인식함.", "10": "같은 자료라도 정제 방법과 분석 기준에 따라 서로 다른 결과가 나타날 수 있다는 의문을 제기함. 자료의 분포와 이상값을 확인하고 통계적 특성을 비교하면서 객관적인 데이터 해석 방법을 탐구함.", "11": "데이터의 특징을 이용하여 미래의 결과를 예측하는 과정에 관심을 가지고 분석 모형의 기본 원리를 탐구함. 문제의 성격에 적합한 예측 방법을 비교하고 결과의 정확성을 판단하기 위한 평가 기준을 탐색함.", "12": "관측된 자료 사이의 관계를 수학적으로 표현하고 이를 새로운 상황에 적용하는 과정에 흥미를 보임. 변수 사이의 관련성을 분석하고 예측 모형의 구성 요소와 성능 평가 방법을 체계적으로 탐구함.", "13": "같은 자료를 활용하더라도 분석 방법에 따라 예측 결과가 달라지는 현상에 주목함. 여러 모형의 특징과 적용 조건을 비교하고 오류의 원인을 분석하여 문제에 적합한 모형을 선정하는 방법을 탐색함.", "14": "데이터 분석 모형의 정확성과 신뢰성을 높이는 조건에 관심을 가지고 탐구 질문을 설정함. 학습 자료와 평가 자료의 역할을 구분하고 예측 결과와 실제 관측값의 차이를 분석하는 방법을 탐색함.", "15": "복잡한 현상을 설명하기 위한 데이터 모형의 활용 가능성과 한계를 함께 탐구함. 입력 변수의 선정과 모형의 복잡도가 결과에 미치는 영향을 살펴보고 타당한 평가 기준을 마련하는 과정에 관심을 보임.", "16": "학교생활에서 발견한 문제를 데이터 과학의 관점에서 해결하려는 탐구 의지를 보임. 문제의 원인과 핵심 조건을 분석하고 필요한 자료의 종류와 수집 방법을 검토하며 실현 가능한 프로젝트 목표를 구체화함.", "17": "지역사회에서 발생하는 다양한 현상을 객관적인 자료로 분석하고 개선 방안을 모색하는 활동에 관심을 보임. 탐구 질문을 설정하고 자료 수집과 분석 및 결과 검증을 연결하는 체계적인 수행 계획을 수립함.", "18": "일상생활의 불편함을 데이터 분석으로 해결할 수 있는 가능성을 발견하고 탐구 주제를 구체화함. 문제 해결에 필요한 변수를 선정하고 분석 결과를 실제 의사결정에 활용하기 위한 프로젝트 절차를 탐색함.", "19": "서로 다른 분야의 자료를 연결하여 새로운 의미를 발견하는 융합적 탐구 활동에 관심을 보임. 협력적인 프로젝트 수행을 위해 분석 목표와 역할을 설정하고 결과의 신뢰성과 재현성을 확보하는 방법을 탐색함.", "20": "데이터 분석 결과를 사회적으로 유용한 해결 방안으로 발전시키는 과정에 관심을 가지고 프로젝트를 계획함. 자료 활용의 윤리성과 개인정보 보호를 고려하며 탐구 결과를 객관적으로 공유하기 위한 기준을 설정함."}, "본문_멘트": {"1": "학교 급식의 잔반 발생량이 요일과 식단에 따라 달라지는 현상에 주목하고 데이터 과학의 문제 해결 절차를 적용함. 급식 인원과 음식 종류 및 잔반량 사이의 관계를 분석하기 위한 탐구 질문을 설정하고 필요한 자료의 종류를 구분함. 수집 가능한 자료와 추가 조사가 필요한 자료를 비교하여 분석 계획을 구체화함. 개인적인 경험에 의존한 판단과 실제 자료에 근거한 판단의 차이를 검토하고 잔반 감소를 위한 합리적인 의사결정 과정을 설명함.", "2": "지역별 대중교통 이용량의 차이가 발생하는 원인을 데이터로 확인하는 탐구를 수행함. 시간대별 승하차 인원과 운행 간격 및 지역별 인구 자료를 비교하여 문제의 핵심 변수를 선정함. 교통 이용량의 변화가 단순한 인구 차이만으로 설명되는지 검토하고 다른 영향을 줄 수 있는 조건을 탐색함. 자료의 수집부터 분석과 해석에 이르는 절차를 단계별로 정리하고 분석 결과를 교통 편의 개선 방안과 연결하는 데이터 기반 의사결정 과정을 제안함.", "3": "일상에서 접하는 날씨 예보와 실제 기상 현상 사이의 차이에 관심을 가지고 데이터 과학의 활용 사례를 탐구함. 기온과 습도 및 강수량 자료가 기상 현상을 설명하는 데 어떤 역할을 하는지 조사하고 관측 자료와 예측 결과를 구분함. 분석 목적에 따라 필요한 정보가 달라지는 이유를 설명하고 자료의 시간적 범위와 측정 조건을 비교함. 객관적인 근거 없이 현상을 일반화하는 판단의 문제점을 검토하며 데이터 과학을 활용한 합리적인 문제 해결 절차를 정리함.", "4": "생활 속 에너지 소비 문제를 자료 기반으로 해결할 수 있는지 탐구함. 가정과 학교의 전력 사용 사례를 비교하고 시간대와 계절 및 기온에 따른 소비량 차이를 분석하기 위한 질문을 설정함. 문제를 설명하는 데 필요한 변수를 선정하고 자료의 수집 가능성과 분석 목적의 적절성을 검토함. 관찰된 현상과 추정한 원인을 구분하여 기록하고 자료에서 확인할 수 있는 사실과 추가 검증이 필요한 가설을 분리함. 분석 결과를 에너지 절약을 위한 의사결정과 연결하는 방안을 제안함.", "5": "온라인 정보의 인기도와 실제 이용자의 만족도가 반드시 일치하는지에 관한 탐구를 수행함. 조회 수와 평가 점수 및 이용 후기 등 서로 다른 자료가 나타내는 의미를 비교하고 자료의 수집 과정에서 발생할 수 있는 편향을 조사함. 단순한 수치의 크기만으로 결론을 내릴 때 발생하는 문제를 사례로 정리하고 여러 지표를 함께 검토할 필요성을 설명함. 분석 목적에 적합한 판단 기준을 설정하고 객관적인 근거를 활용하여 결론의 타당성을 검토하는 절차를 구성함.", "6": "공공데이터를 활용하여 지역별 미세먼지 농도의 변화 양상을 분석함. 측정 시각과 관측 지점 및 농도 단위를 확인하고 누락된 자료와 비정상적인 측정값을 구분하여 정제함. 월별 평균과 최댓값을 계산하여 지역별 특징을 비교하고 특정 시기에 농도가 높아지는 현상을 그래프로 표현함. 평균값만으로 설명하기 어려운 일별 변동을 함께 검토하고 관측 지점의 차이가 결과에 미치는 영향을 분석함. 자료의 출처와 처리 기준을 기록하여 분석 과정의 신뢰성을 높임.", "7": "학교 학생들의 통학 시간을 조사한 자료를 활용하여 이동 시간의 분포를 분석함. 응답 자료에서 단위가 다른 값을 통일하고 입력 오류와 누락 항목을 점검한 뒤 분석 가능한 형태로 정리함. 평균과 중앙값 및 사분위수를 계산하여 통학 시간의 대표적인 특징을 설명하고 상자그림을 통해 분포와 이상값을 확인함. 일부 학생의 긴 통학 시간이 평균에 미치는 영향을 검토하고 집단의 특징을 적절하게 설명하는 통계량을 비교함. 결과를 바탕으로 통학 환경을 이해하기 위한 추가 조사 항목을 제안함.", "8": "지역별 인구 변화 자료를 수집하여 연령대별 인구 구성의 차이를 분석함. 연도와 행정구역의 기준이 일치하는지 확인하고 자료 형식을 통일하여 비교 가능한 표를 구성함. 연령대별 비율과 인구 증감률을 계산하고 막대그래프와 꺾은선그래프로 변화 양상을 시각화함. 전체 인구 규모와 구성 비율의 차이를 구분하여 해석하고 특정 지역에서 나타나는 변화의 특징을 정리함. 그래프의 축과 표시 범위가 해석에 미치는 영향을 검토하여 결과를 정확하게 전달하는 방법을 탐색함.", "9": "학교 도서관의 대출 기록을 활용하여 독서 활동의 특징을 탐구함. 도서 분류와 대출 시기 및 대출 횟수 자료를 정리하고 중복 기록과 누락된 항목을 점검함. 분야별 대출 비율과 월별 이용량을 계산하여 표와 그래프로 나타내고 학기 중 이용량 변화의 특징을 비교함. 특정 분야의 대출이 많은 이유를 자료만으로 단정할 수 없음을 설명하고 추가로 필요한 정보를 제안함. 분석 결과를 바탕으로 도서 구입과 독서 활동 지원에 활용할 수 있는 개선 방향을 정리함.", "10": "기상 관측 자료를 이용하여 기온과 습도 사이의 관계를 분석함. 관측 날짜와 시간의 일치 여부를 확인하고 결측값을 처리한 뒤 두 변수의 자료를 연결함. 산점도를 작성하여 값의 분포와 변화 경향을 관찰하고 상관계수를 계산하여 관계의 방향과 정도를 해석함. 특정 계절의 자료만 사용할 때와 전체 기간을 사용할 때 나타나는 차이를 비교하고 상관관계만으로 인과관계를 단정할 수 없음을 설명함. 분석 과정에서 자료의 범위와 조건이 결론에 미치는 영향을 검토함.", "11": "주택의 면적과 건축 연도 및 교통 접근성 자료를 활용하여 주택 가격 예측 모형을 구성함. 입력 변수와 예측 대상을 구분하고 학습 자료와 평가 자료를 나누어 분석함. 회귀 모형으로 예측값을 산출한 뒤 실제 가격과의 차이를 계산하고 오차가 크게 나타나는 사례의 특징을 조사함. 입력 변수의 조합을 변경하여 예측 성능을 비교하고 특정 변수의 추가가 결과에 미치는 영향을 검토함. 분석 결과를 바탕으로 모형의 활용 가능성과 예측의 한계를 설명함.", "12": "기온과 습도 및 기압 자료를 이용하여 강수 여부를 분류하는 모형을 탐구함. 관측 자료의 결측값을 확인하고 입력 변수와 실제 강수 여부를 구분하여 학습 자료를 구성함. 분류 모형을 적용한 뒤 실제 결과와 예측 결과를 비교하여 정확도와 오분류 사례를 분석함. 강수가 발생한 날과 발생하지 않은 날의 자료 비율을 확인하고 단순 정확도만으로 성능을 판단할 때의 문제점을 검토함. 여러 평가 지표를 함께 살펴보고 예측 결과의 신뢰성을 높이기 위한 개선 방향을 제시함.", "13": "학생의 학습 시간과 과제 수행 기록을 활용하여 학습 성과와 관련된 요인을 분석함. 수집 자료에서 개인정보를 제거하고 분석에 필요한 변수만 선정하여 예측 모형을 구성함. 학습 자료와 평가 자료를 구분하고 예측 결과를 실제 관측값과 비교하여 오차를 계산함. 학습 시간만을 이용한 모형과 여러 변수를 함께 활용한 모형의 성능을 비교하며 예측에 유용한 정보를 탐색함. 분석 결과가 개인의 능력을 단정하는 근거로 사용되지 않도록 해석상의 한계와 윤리적 고려 사항을 정리함.", "14": "상품 판매량과 계절 및 가격 변동 자료를 이용하여 수요 예측 모형의 성능을 비교함. 자료의 시간 순서를 고려하여 학습 구간과 평가 구간을 설정하고 미래 자료가 학습 과정에 포함되지 않도록 점검함. 서로 다른 예측 방법으로 판매량을 추정한 뒤 실제 판매량과의 오차를 계산함. 특정 시기에 오차가 커지는 현상을 분석하고 계절적 변화와 일시적 사건의 영향을 검토함. 반복적인 성능 비교를 통해 적절한 모형을 선정하고 새로운 상황에서 발생할 수 있는 예측의 한계를 설명함.", "15": "데이터 분석 모형에서 과적합이 발생하는 원인을 탐구하고 성능 개선 실험을 수행함. 모형의 복잡도와 학습 조건을 변경하면서 학습 자료와 평가 자료의 오차를 각각 기록함. 두 자료에서 나타나는 성능 차이를 그래프로 표현하여 과적합의 특징을 분석하고 복잡도를 줄였을 때의 변화를 확인함. 여러 실험 결과를 비교하여 특정 조건에서만 성능이 높게 나타나는 현상을 설명함. 학습 자료에 대한 정확도와 새로운 자료에 대한 일반화 성능을 함께 고려하여 적절한 모형을 선정함.", "16": "학교 급식의 잔반을 줄이기 위한 데이터 분석 프로젝트를 설계하고 수행함. 식단 종류와 급식 인원 및 잔반량을 기록할 수 있는 자료 수집 계획을 수립하고 분석 항목을 선정함. 수집 자료를 정제한 뒤 식단별 잔반량의 차이를 비교하고 결과를 그래프로 나타냄. 특정 식단에서 잔반이 많이 발생하는 현상을 확인하고 선호도 조사 등 추가 자료의 필요성을 검토함. 분석 결과를 바탕으로 식단 안내와 적정 배식량 조정 방안을 제안하고 개선 효과를 검증할 수 있는 후속 조사 계획을 마련함.", "17": "지역의 교통사고 발생 특성을 분석하여 안전한 통학 환경을 제안하는 프로젝트를 수행함. 공공데이터에서 사고 발생 시간과 위치 및 유형에 관한 자료를 수집하고 중복 기록과 누락된 항목을 점검함. 시간대별 사고 빈도와 지역별 분포를 시각화하여 위험이 집중되는 조건을 탐색함. 사고 건수만으로 지역의 위험도를 단정하기 어렵다는 점을 인식하고 교통량과 보행자 수 등 추가 변수를 검토함. 분석 결과를 바탕으로 통학로 안전 안내 방안을 제안하고 자료의 한계를 명확하게 설명함.", "18": "학교의 전력 소비를 줄이기 위한 데이터 과학 프로젝트를 계획하고 실행함. 시간대별 전력 사용량과 기온 및 교실 이용 현황을 조사하여 분석 자료를 구성함. 결측값과 측정 단위를 점검하고 사용량의 변화 추이를 그래프로 나타내어 소비가 집중되는 시간대를 파악함. 기온과 이용 인원 등의 변수가 전력 사용량에 미치는 영향을 비교하고 단순한 상관관계와 실제 원인 사이의 차이를 검토함. 분석 결과를 근거로 절전 실천 방안을 제시하고 적용 전후의 효과를 비교하기 위한 평가 기준을 마련함.", "19": "지역별 생활 폐기물 배출량을 비교하여 자원 순환 개선 방안을 탐구하는 프로젝트를 수행함. 연도별 폐기물 발생량과 인구 자료를 수집하고 행정구역과 측정 단위를 일치시켜 분석함. 전체 배출량과 인구당 배출량을 구분하여 계산하고 지역별 차이를 그래프로 표현함. 특정 지역의 배출량이 높은 원인을 단순한 수치만으로 판단하지 않고 산업 구조와 생활환경 등 추가 요인을 검토함. 분석 결과를 바탕으로 분리배출 개선 방안을 제안하고 자료 활용 과정의 신뢰성과 재현성을 점검함.", "20": "학교 도서관의 이용 활성화를 위한 데이터 분석 프로젝트를 수행함. 대출 시기와 도서 분야 및 이용 빈도 자료를 정리하고 개인을 식별할 수 있는 정보를 제외하여 분석 자료를 구성함. 월별 대출량과 분야별 이용 비율을 계산하고 시각화 결과를 통해 이용 경향을 비교함. 특정 시기에 대출이 감소하는 현상을 발견하고 학사 일정과 도서 구비 현황 등 추가 요인을 검토함. 분석 결과를 바탕으로 독서 행사와 도서 배치 개선 방안을 제안하고 실행 효과를 확인할 수 있는 평가 절차를 설계함."}, "마무리_멘트": {"1": "데이터 과학의 문제 해결 절차를 체계적으로 이해하고 실생활 현상을 객관적인 근거로 설명하는 능력이 돋보임. 다양한 자료를 종합하여 합리적인 결론을 도출하며 자기주도적인 탐구 역량과 논리적 사고력을 발전시킴.", "2": "직관적인 판단과 데이터에 근거한 의사결정의 차이를 명확하게 설명함. 복잡한 현상에서 핵심 정보를 발견하고 분석 결과를 새로운 상황에 적용하며 근거 중심의 판단력과 비판적 사고 역량을 보여 줌.", "3": "데이터 과학의 활용 가능성을 여러 분야와 연결하여 폭넓게 이해함. 탐구 과정에서 발견한 의문을 구체적인 분석 문제로 발전시키고 객관적인 자료를 바탕으로 해결 방안을 탐색하는 학문적 호기심이 돋보임.", "4": "사회적 현상을 데이터의 관점에서 해석하고 문제 해결에 필요한 핵심 조건을 체계적으로 정리함. 분석 결과의 의미와 한계를 균형 있게 검토하며 합리적인 의사결정 능력과 융합적인 탐구 역량을 발전시킴.", "5": "데이터가 새로운 지식과 가치를 창출하는 과정을 구체적인 사례로 설명함. 자료에 담긴 의미를 다각도로 해석하고 탐구 결과를 실생활 문제와 연결하며 창의적인 문제 발견 능력과 성찰적인 학습 태도를 보여 줌.", "6": "자료 수집과 정제 과정의 중요성을 이해하고 결측값과 이상값을 합리적으로 처리하는 능력이 돋보임. 분석 목적에 적합한 자료를 선정하고 결과의 신뢰성을 검토하며 정확하고 체계적인 데이터 분석 역량을 발전시킴.", "7": "평균과 중앙값 및 산포도 등 기초 통계량을 활용하여 자료의 특징을 객관적으로 설명함. 수치의 차이가 발생하는 원인을 탐색하고 분석 결과를 논리적으로 해석하며 수학적 사고력과 자료 분석 능력을 보여 줌.", "8": "자료의 특성에 적합한 그래프를 선택하고 시각화 결과에서 의미 있는 경향과 관계를 발견하는 능력이 돋보임. 복잡한 분석 결과를 명확하게 전달하고 근거를 바탕으로 결론을 설명하는 의사소통 역량을 발전시킴.", "9": "공공데이터의 수집 경로와 신뢰성을 검토하고 분석에 필요한 자료를 체계적으로 정리함. 자료의 출처와 활용 조건을 확인하는 책임감 있는 태도를 바탕으로 객관적인 분석 능력과 정보 활용 역량을 보여 줌.", "10": "자료의 분포와 이상값이 통계적 해석에 미치는 영향을 정확하게 분석함. 여러 분석 방법의 결과를 비교하여 해석의 타당성을 검토하고 오류 가능성을 스스로 점검하며 비판적인 데이터 해석 역량을 발전시킴.", "11": "분석 목적에 적합한 예측 모형을 선정하고 결과의 정확성과 한계를 체계적으로 평가하는 능력이 돋보임. 실제 관측값과 예측값의 차이를 근거로 개선 방향을 제시하며 논리적인 문제 해결 역량을 발전시킴.", "12": "변수 사이의 관계를 수학적으로 해석하고 이를 분석 모형에 적용하는 능력을 보여 줌. 모형의 구성 원리와 예측 결과를 연결하여 설명하고 다양한 조건을 비교하며 수학적 모델링 역량과 분석적 사고력을 발전시킴.", "13": "서로 다른 분석 모형의 성능을 객관적으로 비교하고 문제 상황에 적합한 방법을 선정함. 예측 오류의 원인을 추적하고 결과의 신뢰성을 검토하며 합리적인 판단력과 과학적인 탐구 태도가 돋보임.", "14": "학습 자료와 평가 자료의 차이를 이해하고 모형의 일반화 가능성을 비판적으로 검토함. 성능 향상을 위한 조건을 반복적으로 탐색하고 실험 결과를 근거로 개선 방안을 도출하는 자기주도적 연구 역량을 보여 줌.", "15": "입력 변수와 모형의 복잡도가 예측 결과에 미치는 영향을 종합적으로 분석함. 높은 정확도뿐 아니라 해석 가능성과 활용상의 한계를 함께 고려하며 균형 잡힌 평가 능력과 깊이 있는 탐구 역량을 발전시킴.", "16": "실생활 문제를 구체적인 탐구 질문으로 발전시키고 자료 분석을 통해 해결 방안을 제안하는 능력이 돋보임. 프로젝트의 수행 결과를 객관적으로 검증하고 발견한 한계를 새로운 개선 과제로 연결하며 자기주도적 탐구 역량을 발휘함.", "17": "지역사회 문제를 데이터에 근거하여 분석하고 실현 가능한 개선 방향을 제시함. 분석 결과를 사회적 맥락과 연결하여 해석하고 탐구의 성과와 제약을 함께 검토하며 공동체에 기여하려는 문제 해결 태도를 보여 줌.", "18": "프로젝트의 목표 설정부터 자료 수집과 분석 및 결과 검증까지 체계적으로 수행하는 능력이 돋보임. 예상하지 못한 문제에도 해결 방법을 탐색하고 분석 절차를 개선하며 끈기 있는 탐구 자세와 실행 역량을 발전시킴.", "19": "다양한 분야의 지식을 연결하여 자료에 담긴 새로운 의미를 발견하고 협력적으로 문제를 해결함. 분석 과정과 결과를 명확하게 공유하고 재현 가능성을 검토하며 융합적 사고력과 협업 및 의사소통 역량을 보여 줌.", "20": "자료 활용의 윤리성과 개인정보 보호의 중요성을 인식하고 책임감 있게 탐구 결과를 공유함. 분석의 정확성과 사회적 유용성을 함께 고려하며 데이터 과학을 통해 지속 가능한 가치를 창출하려는 성찰적인 태도가 돋보임."}};
const specs=[['시작','시작_멘트',1],['본문 ①','본문_멘트',1],['본문 ②','본문_멘트',2],['마무리','마무리_멘트',1]];
const fields=document.getElementById('fields'), selects=[];
specs.forEach(([label,key,initial],i)=>{const wrap=document.createElement('div');wrap.className='field';const lab=document.createElement('label');lab.htmlFor='s'+i;lab.textContent=label;const select=document.createElement('select');select.id='s'+i;for(let n=1;n<=20;n++){const op=document.createElement('option');op.value=n;op.textContent=String(n).padStart(2,'0')+'. '+banks[key][n].slice(0,76)+'…';select.append(op)}select.value=initial;const preview=document.createElement('div');preview.className='preview';preview.id='p'+i;wrap.append(lab,select,preview);fields.append(wrap);selects.push(select);select.addEventListener('change',refresh)});
const result=document.getElementById('result'),status=document.getElementById('status'),error=document.getElementById('error');
function refresh(){selects.forEach((s,i)=>document.getElementById('p'+i).textContent=banks[specs[i][1]][s.value]);const duplicate=selects[1].value===selects[2].value;error.textContent=duplicate?'본문 ①과 본문 ②는 서로 다른 번호를 선택해야 합니다.':'';document.getElementById('generate').disabled=duplicate;}
function count(){const t=result.value;status.textContent='공백 포함 '+t.length+'자 / 공백 제외 '+t.replace(/\s/g,'').length+'자 / 목표 약 600자'}
document.getElementById('generate').onclick=()=>{if(selects[1].value===selects[2].value){alert('본문 ①과 본문 ②는 서로 다른 번호를 선택해야 합니다.');return}result.value=specs.map((s,i)=>banks[s[1]][selects[i].value]).join(' ');count();result.focus()};
result.addEventListener('input',count);
document.getElementById('copy').onclick=async()=>{if(!result.value.trim()){alert('먼저 문장을 생성하세요.');return}try{await navigator.clipboard.writeText(result.value);alert('과세특 문장을 복사했습니다.')}catch(e){result.focus();result.select();const ok=document.execCommand('copy');alert(ok?'과세특 문장을 복사했습니다.':'자동 복사가 제한되었습니다. 선택된 문장을 Ctrl+C로 복사하세요.')}};
document.getElementById('save').onclick=()=>{if(!result.value.trim()){alert('먼저 문장을 생성하세요.');return}const date=new Date(),pad=n=>String(n).padStart(2,'0'),stamp=date.getFullYear()+pad(date.getMonth()+1)+pad(date.getDate())+'_'+pad(date.getHours())+pad(date.getMinutes())+pad(date.getSeconds());const blob=new Blob(['\ufeff',result.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='데이터과학_과세특_'+stamp+'.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('reset').onclick=()=>{result.value='';selects.forEach((s,i)=>s.value=specs[i][2]);refresh();status.textContent='문장 생성 단추를 누르세요.'};document.getElementById('print').onclick=()=>window.print();refresh();
</script></body></html>
