<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정보과학 과세특 문장 조합기</title><style>body{font-family:'Malgun Gothic',sans-serif;background:#f3f6fa;color:#203249;max-width:1000px;margin:35px auto;padding:15px}section{background:white;border:1px solid #d9e3ee;border-radius:15px;padding:24px;margin:18px 0}label{display:block;font-weight:bold;margin:15px 0 6px}select,textarea{width:100%;box-sizing:border-box;border:1px solid #b7c6d7;border-radius:8px;padding:12px;font:inherit}textarea{height:330px;line-height:1.8}button{padding:12px 17px;border:0;border-radius:8px;background:#235c91;color:white;cursor:pointer;margin:12px 5px 0 0}#warn{color:#b42318;font-weight:bold}#count{font-weight:bold;color:#235c91}</style><h1>정보과학 과세특 문장 조합기</h1><p>시작 1개 + 본문 2개(서로 다른 유형) + 마무리 1개 | 각 20유형</p><section><label>시작 멘트</label><select id="a"></select><label>본문 멘트 ①</label><select id="b"></select><label>본문 멘트 ②</label><select id="c"></select><label>마무리 멘트</label><select id="d"></select><p id="warn" role="alert"></p><button onclick="generate()">문장 생성</button><button onclick="copyText()">전체 복사</button><button onclick="saveText()">TXT 저장</button><button onclick="reset()">초기화</button></section><section><h2>완성된 과세특 문장</h2><p id="count">0자</p><textarea id="result" oninput="count()"></textarea><p>※ 실제 학생의 수행활동과 산출물에 맞게 확인·수정하여 사용하세요.</p></section><script>const D={"시작_멘트": {"01. [프로그래밍] 함수와 매개변수": "일상에서 반복되는 계산 과정에 관심을 갖고 자료 처리의 정확성과 효율성을 높이는 방법을 탐구 주제로 설정함. 입력과 출력 조건을 분석하고 문제를 작은 기능으로 나누어 해결하는 방안을 구체화함.", "02. [프로그래밍] 재귀 함수": "자연과 수학에서 반복되는 구조에 흥미를 갖고 작은 문제의 해결을 반복하여 큰 문제를 해결하는 원리를 탐색함. 재귀적 규칙과 종료 조건의 관계를 분석하며 탐구 과제를 설정함.", "03. [프로그래밍] 모듈과 협업": "서로 다른 기능을 결합하여 하나의 프로그램을 완성하는 협업의 가치에 관심을 가짐. 구성원별 역할과 기능 간 연결 조건을 분석하고 재사용 가능한 프로그램 구조를 탐구함.", "04. [프로그래밍] 객체 지향 설계": "학교생활의 자료 관리 문제를 해결하기 위해 실제 대상을 속성과 동작으로 구분하는 방법을 탐색함. 문제의 요구를 분석하고 객체 간 관계를 중심으로 프로그램 구조를 설계하고자 함.", "05. [자료구조] 스택": "수식에서 괄호의 순서가 올바른지 판별하는 과정에 주목하여 자료의 저장 순서와 처리 순서의 관계를 탐구함. 후입선출 구조를 실제 문제에 적용하는 방법을 구체화함.", "06. [자료구조] 큐": "학교생활에서 순서대로 처리해야 하는 대기 상황을 관찰하고 공정한 처리 방식을 정보과학적으로 모델링함. 자료의 삽입과 삭제 순서를 분석하여 해결 방안을 탐구함.", "07. [자료구조] 트리 순회": "계층적으로 연결된 자료를 효율적으로 탐색하는 방법에 관심을 갖고 트리 구조의 특징을 분석함. 노드의 방문 순서에 따라 결과가 달라지는 이유를 탐구 과제로 설정함.", "08. [자료구조] 그래프 표현": "학교 건물과 이동 통로의 연결 관계를 수학적 구조로 표현하는 방법에 관심을 가짐. 정점과 간선의 의미를 분석하고 자료의 저장 방식에 따른 차이를 탐구함.", "09. [알고리즘] 너비 우선 탐색": "학교 건물 사이에서 이동 횟수가 가장 적은 경로를 찾는 문제를 발견하고 이를 그래프 탐색 문제로 정의함. 출발점과 도착점, 이동 조건을 구체화하여 해결 방법을 탐구함.", "10. [알고리즘] 깊이 우선 탐색": "미로에서 이동 가능한 경로를 체계적으로 찾는 문제에 관심을 갖고 연결된 위치를 순서대로 방문하는 방법을 탐색함. 방문 기록과 되돌아가기의 필요성을 분석함.", "11. [알고리즘] 완전 탐색": "주어진 조건을 만족하는 조합을 빠짐없이 찾는 방법에 관심을 갖고 가능한 경우의 수를 분석함. 모든 선택을 조사하는 방식의 정확성과 계산 부담을 함께 탐구함.", "12. [알고리즘] 백트래킹과 가지치기": "선택에 따라 달라지는 탐색 경로를 상태 공간으로 표현하고 불가능한 경로를 조기에 제외하는 방법에 관심을 가짐. 정답의 누락 없이 탐색량을 줄이는 조건을 탐구함.", "13. [알고리즘] 탐욕법과 반례": "현재 가장 유리한 선택이 언제나 전체의 최적 결과를 보장하는지 의문을 제기함. 선택 기준과 적용 조건을 분석하고 반례를 통해 해결 전략의 타당성을 검토하고자 함.", "14. [알고리즘] 분할정복": "복잡한 자료를 작은 부분으로 나누어 처리하는 방법에 관심을 갖고 분할과 결합 과정의 규칙을 분석함. 부분 문제를 재귀적으로 해결하는 전략의 효율성을 탐구함.", "15. [알고리즘] 동적계획법": "반복 계산으로 실행 시간이 늘어나는 현상을 발견하고 계산 결과를 다시 활용할 수 있는 방법을 탐색함. 부분 문제의 중복과 점화식의 관계를 분석하여 탐구를 시작함.", "16. [알고리즘] 시간 복잡도": "입력 자료가 증가할 때 프로그램 실행에 필요한 연산량이 어떻게 변하는지 질문함. 서로 다른 탐색 방법의 비교 횟수와 실행 효율을 분석하는 탐구 과제를 설정함.", "17. [프로젝트] 전력 절약 프로젝트": "교실의 불필요한 전력 소비 문제를 발견하고 정보과학을 활용하여 사용량을 분석하는 방법을 탐색함. 소비 전력과 사용 시간 등 핵심 변수를 선정하고 문제를 구체화함.", "18. [프로젝트] 일정 관리와 검증": "수행평가 일정이 중복되거나 누락되는 문제를 발견하고 일정 관리의 편의성을 높이는 프로그램을 구상함. 사용자 요구와 입력 조건을 분석하고 검증 방법을 탐색함.", "19. [프로젝트] 협업 프로젝트": "여러 사람이 개발한 기능을 하나로 연결할 때 발생하는 문제에 관심을 갖고 공동 개발의 절차를 탐구함. 역할 분담과 기능별 인터페이스를 구체화하여 프로젝트를 계획함.", "20. [프로젝트] 정보윤리": "학습 자료 공유 과정에서 개인정보와 저작권을 보호해야 하는 이유를 탐구함. 자료 접근 권한과 출처 표시의 필요성을 분석하고 책임 있는 정보 활용을 위한 해결 방안을 구상함."}, "본문_멘트": {"01. [프로그래밍] 함수와 매개변수": "학생별 점수 자료를 입력받아 평균과 최고점, 성취 수준을 산출하는 프로그램을 구현함. 계산 기능을 독립적인 함수로 분리하고 매개변수와 반환값을 활용하여 기능의 재사용성을 높임. 빈 목록과 만점, 최저점 등 다양한 입력을 적용하여 실행 결과를 검증하고 자료형 오류가 발생하는 조건을 찾아 수정함. 함수의 책임을 명확히 구분하고 중복된 계산 과정을 개선함.", "02. [프로그래밍] 재귀 함수": "거북이 그래픽으로 시에르핀스키 삼각형을 그리는 재귀 프로그램을 구현함. 도형을 작은 삼각형으로 분할하는 규칙을 분석하고 재귀 호출의 종료 조건과 깊이에 따른 변화를 설명함. 재귀 깊이를 달리하며 도형의 개수와 실행 시간을 비교하고 좌표 계산 오류를 수정함. 반복되는 기하학적 구조를 함수 호출로 표현하며 수학적 규칙을 일반화함.", "03. [프로그래밍] 모듈과 협업": "수학 계산 기능을 공동으로 개발하는 활동에서 소수 판별과 약수 계산을 담당하여 독립적인 모듈로 구현함. 함수별 입력 자료형과 반환값을 명세하고 다른 구성원의 모듈과 연결하여 통합 프로그램을 완성함. 잘못된 입력과 경계 조건을 검증하고 함수 이름 충돌 문제를 해결함. 기능별 책임과 모듈 간 의존 관계를 분석함.", "04. [프로그래밍] 객체 지향 설계": "도서 대출 관리 문제를 해결하기 위해 도서와 이용자를 객체로 모델링하고 속성과 동작을 구분하여 클래스를 설계함. 생성자와 메서드로 대출 및 반납 기능을 구현하고 객체별 상태 변화를 확인함. 중복 대출과 미등록 도서 등 예외 상황을 검증하며 오류를 수정함. 자료와 기능을 하나로 조직하는 객체 지향 설계의 장점을 설명함.", "05. [자료구조] 스택": "수식에 포함된 괄호의 짝을 검사하는 프로그램을 제작하며 스택의 후입선출 원리를 적용함. 여는 괄호를 저장하고 닫는 괄호가 나타날 때 가장 최근 원소와 비교하는 알고리즘을 구현함. 정상 수식과 괄호 누락, 순서 오류를 검증하고 빈 스택에서 원소를 제거하려는 오류를 수정함. 삽입과 삭제 과정의 의미를 분석함.", "06. [자료구조] 큐": "급식 대기 순서를 관리하는 프로그램을 구현하며 큐의 선입선출 원리를 탐구함. 대기 학생을 순서대로 추가하고 먼저 등록된 학생부터 처리하도록 설계함. 양방향 큐를 활용하여 삽입과 삭제를 구현하고 일반 목록의 앞부분 삭제 방식과 연산 효율을 비교함. 대기 인원이 없는 상황과 연속 요청을 검증함.", "07. [자료구조] 트리 순회": "이진트리의 계층적 구조를 분석하고 전위, 중위, 후위 순회 결과를 출력하는 프로그램을 구현함. 현재 노드를 방문하는 시점과 왼쪽 및 오른쪽 부분 트리의 처리 순서를 비교함. 재귀 함수로 순회 과정을 표현하고 노드가 하나인 경우와 비어 있는 트리의 결과를 검증함. 트리 구조와 재귀 호출의 관계를 설명함.", "08. [자료구조] 그래프 표현": "학교 건물 사이의 이동 통로를 정점과 간선으로 모델링하고 인접 행렬과 인접 리스트를 각각 구현함. 동일한 연결 관계를 두 방식으로 표현하고 정점 수와 간선 수에 따른 저장 공간의 차이를 분석함. 간선의 추가와 삭제에 따른 자료구조의 변화를 확인하고 연결되지 않은 정점이 존재하는 경우도 검증함.", "09. [알고리즘] 너비 우선 탐색": "학교 건물 사이의 최단 이동 경로를 찾기 위해 그래프를 구성하고 너비 우선 탐색을 적용함. 큐와 방문 기록을 활용하여 정점을 탐색하고 이전 정점 정보를 저장하여 경로를 복원함. 모든 간선의 이동 비용이 동일할 때 최단 경로를 구할 수 있는 원리를 설명함. 출발점과 도착점이 같거나 연결되지 않은 경우를 검증함.", "10. [알고리즘] 깊이 우선 탐색": "격자 형태의 미로를 그래프로 표현하고 깊이 우선 탐색을 이용하여 이동 가능한 경로를 탐색함. 방문 여부를 기록하고 재귀 호출로 연결된 위치를 차례로 확인함. 막다른 경로에서 이전 위치로 되돌아가는 과정을 분석하고 방문 기록이 없을 때 발생하는 반복 탐색 문제를 해결함. 탐색 순서에 따른 경로의 차이를 설명함.", "11. [알고리즘] 완전 탐색": "주어진 자연수 집합에서 합계가 목표값과 일치하는 부분집합을 찾는 프로그램을 구현함. 각 원소의 선택 여부를 두 상태로 구분하여 가능한 모든 부분집합을 생성하고 결과를 검증함. 원소의 개수가 증가할 때 탐색 대상이 지수적으로 증가하는 이유를 분석함. 공집합과 중복값, 해가 없는 경우를 시험함.", "12. [알고리즘] 백트래킹과 가지치기": "체스판에 여왕을 서로 공격하지 않도록 배치하는 문제에 백트래킹을 적용함. 행별로 배치 가능한 열을 탐색하고 같은 열과 대각선의 충돌 여부를 검사하여 불가능한 경로를 배제함. 네 개의 여왕을 배치하는 문제에서 가능한 해를 확인하고 가지치기 전후의 탐색 횟수를 비교함. 정답 누락을 방지하는 조건을 검토함.", "13. [알고리즘] 탐욕법과 반례": "거스름돈을 최소 개수의 동전으로 지급하는 문제에서 가장 큰 동전부터 선택하는 탐욕 알고리즘을 구현함. 동전의 종류를 달리하며 선택 결과를 비교하고 특정 동전 체계에서는 최적해를 보장하지 않는 반례를 구성함. 완전 탐색 결과와 비교하여 정확성을 검증하고 적용 가능한 조건을 분석함.", "14. [알고리즘] 분할정복": "측정 자료를 오름차순으로 정렬하기 위해 병합정렬 알고리즘을 구현함. 자료를 절반씩 분할하고 정렬된 부분 목록을 병합하는 재귀적 과정을 분석함. 이미 정렬된 자료와 역순 자료, 중복값이 포함된 자료를 활용하여 정확성을 검증함. 입력 크기에 따른 비교 횟수와 실행 시간의 변화를 관찰함.", "15. [알고리즘] 동적계획법": "격자에서 출발점부터 도착점까지 이동하는 최소 비용을 계산하는 프로그램을 구현함. 각 위치까지의 최소 누적 비용을 점화식으로 표현하고 이전 계산 결과를 저장하여 중복 연산을 줄임. 작은 격자에서는 가능한 경로를 직접 비교하여 정확성을 검증함. 격자의 크기를 늘리며 완전 탐색과 계산량 차이를 분석함.", "16. [알고리즘] 시간 복잡도": "선형 탐색과 이진 탐색의 성능을 비교하기 위해 입력 자료의 크기를 단계적으로 증가시키는 실험을 설계함. 정렬된 자료에서 비교 횟수를 측정하고 입력 크기에 따른 증가 양상을 분석함. 이진 탐색의 정렬 조건과 중간 위치 갱신 원리를 설명하고 경계값 처리 오류를 수정함. 측정값과 이론적인 시간 복잡도를 구분함.", "17. [프로젝트] 전력 절약 프로젝트": "교실 전력 사용량을 계산하는 모의실험 프로그램을 기획함. 조명과 냉난방 기기의 사용 시간, 소비 전력, 이용 인원을 변수로 선정하고 입력 조건과 출력 결과를 정의함. 전력 사용량과 예상 비용을 계산하는 기능을 구현하고 사용 조건을 변경하며 절감 효과를 비교함. 실제 환경과 계산 모형의 차이를 검토함.", "18. [프로젝트] 일정 관리와 검증": "수행평가 일정 관리 프로그램을 제작하여 과목과 제출일, 과제 상태를 저장하고 날짜순 정렬과 마감 일정 확인 기능을 구현함. 정상적인 날짜뿐 아니라 잘못된 날짜 형식과 중복 일정, 빈 입력을 시험하여 오류 발생 조건을 분석함. 검증 결과를 바탕으로 입력 처리와 안내 기능을 개선함.", "19. [프로젝트] 협업 프로젝트": "구성원들과 학습용 도구를 제작하고 문제 출제, 정답 판정, 결과 저장 기능을 각각의 모듈로 설계함. 모듈 사이에 전달되는 자료의 형식과 함수의 역할을 협의하고 통합 과정에서 발생한 오류를 수정함. 정상 입력과 예외 상황을 공동으로 검증하고 수정 내용을 기록하여 공유함.", "20. [프로젝트] 정보윤리": "학습 자료를 안전하게 공유하는 프로그램을 설계하며 개인정보 보호와 저작권 준수의 필요성을 탐구함. 자료별 접근 권한과 출처 표시 기능을 구상하고 개인정보가 포함된 자료의 공개 위험을 분석함. 허가되지 않은 접근과 잘못된 입력을 가정하여 검증 사례를 구성함."}, "마무리_멘트": {"01. [프로그래밍] 함수와 매개변수": "입력 조건에 따른 결과를 검증하고 기능을 개선하는 과정에서 함수의 역할을 명확히 설명함. 단순한 정답 산출을 넘어 재사용성과 정확성을 함께 고려하며 논리적 설계 역량을 발전시킴.", "02. [프로그래밍] 재귀 함수": "반복되는 규칙을 작은 문제로 분해하고 종료 조건을 검증하며 재귀적 사고를 심화함. 수학적 구조를 프로그램으로 표현하고 오류를 수정하는 과정에서 탐구의 끈기와 분석력을 보여 줌.", "03. [프로그래밍] 모듈과 협업": "함수의 책임과 연결 규칙을 명확히 하여 협업의 완성도를 높임. 자신의 결과를 다른 구성원의 기능과 비교하고 수정하며 공동 목표를 위한 의사소통과 책임감을 발휘함.", "04. [프로그래밍] 객체 지향 설계": "객체의 상태와 동작을 구분하여 설계의 근거를 설명함. 다양한 예외를 검증하고 수정하는 과정에서 프로그램의 확장성과 유지 보수성을 고려하는 체계적인 문제 해결 역량을 보여 줌.", "05. [자료구조] 스택": "자료의 처리 순서가 문제 해결 결과에 미치는 영향을 근거로 설명함. 예외 상황까지 점검하고 오류를 수정하며 자료구조의 특성을 정확하게 활용하는 역량을 발전시킴.", "06. [자료구조] 큐": "선입선출 원리를 실제 상황에 적용하고 자료구조별 효율을 비교함. 처리 순서의 공정성과 프로그램의 안정성을 함께 고려하며 합리적인 설계 및 검증 태도를 보여 줌.", "07. [자료구조] 트리 순회": "방문 순서와 재귀 호출의 관계를 분석하며 계층적 자료의 처리 원리를 이해함. 경계 상황을 검증하고 결과를 설명하는 과정에서 추상화 능력과 논리적 사고력을 심화함.", "08. [자료구조] 그래프 표현": "연결 관계를 다양한 구조로 표현하고 저장 효율의 차이를 분석함. 문제의 특성에 맞는 자료구조를 선택하며 실생활 상황을 정보과학적으로 모델링하는 능력을 발전시킴.", "09. [알고리즘] 너비 우선 탐색": "탐색 과정과 경로 복원의 근거를 명확히 설명함. 연결되지 않은 경우까지 검증하고 중복 방문을 방지하며 정확성과 효율성을 함께 고려하는 문제 해결 역량을 보여 줌.", "10. [알고리즘] 깊이 우선 탐색": "방문 순서와 되돌아가기의 원리를 탐구하며 탐색 과정의 타당성을 검토함. 오류를 발견하고 수정하는 경험을 통해 재귀적 사고와 체계적인 문제 해결 능력을 심화함.", "11. [알고리즘] 완전 탐색": "모든 경우를 조사하는 방식의 정확성을 확인하고 입력 크기에 따른 계산량의 변화를 분석함. 결과의 타당성을 근거로 설명하며 탐색 알고리즘의 장점과 한계를 균형 있게 이해함.", "12. [알고리즘] 백트래킹과 가지치기": "불가능한 경로를 배제하면서 정답을 유지하는 조건을 논리적으로 검증함. 탐색량을 비교하고 알고리즘을 개선하며 정확성과 효율성을 함께 추구하는 분석적 사고력을 보여 줌.", "13. [알고리즘] 탐욕법과 반례": "직관적인 선택이 항상 최적해를 보장하지 않음을 반례로 입증함. 알고리즘의 적용 조건을 확인하고 근거를 바탕으로 해결 전략을 평가하는 비판적 사고력을 발전시킴.", "14. [알고리즘] 분할정복": "분할과 결합의 절차를 체계적으로 설명하고 다양한 입력에서 결과를 검증함. 자료 크기에 따른 효율을 분석하며 재귀적 설계와 성능 평가를 연결하는 역량을 보여 줌.", "15. [알고리즘] 동적계획법": "중복 부분 문제를 찾아 저장하는 전략의 효과를 비교하고 점화식의 타당성을 검증함. 계산량을 줄이면서 정확성을 유지하는 방법을 탐구하며 효율적인 알고리즘 설계 능력을 심화함.", "16. [알고리즘] 시간 복잡도": "실험 결과와 이론적 분석을 비교하여 효율성 판단의 근거를 제시함. 입력 조건과 자료의 특성을 함께 고려하며 정확하고 합리적인 알고리즘 선택 역량을 발전시킴.", "17. [프로젝트] 전력 절약 프로젝트": "실생활의 문제를 변수와 계산 절차로 모델링하고 조건별 결과를 분석함. 모형의 한계를 인식하고 개선 방향을 제안하며 정보과학을 생활 속 문제 해결에 적용하는 역량을 보여 줌.", "18. [프로젝트] 일정 관리와 검증": "사용자 요구를 반영하고 정상·경계·예외 상황을 검증하여 프로그램의 신뢰성을 높임. 오류를 기록하고 수정하는 과정에서 체계적인 개발 태도와 개선 역량을 발휘함.", "19. [프로젝트] 협업 프로젝트": "공동의 목표를 위해 기능별 역할을 조정하고 통합 오류를 해결함. 협의와 검증 과정을 성실히 수행하며 재사용 가능한 프로그램 구조와 협력적 문제 해결의 가치를 실천함.", "20. [프로젝트] 정보윤리": "기술적 기능뿐 아니라 개인정보 보호와 출처 표시의 필요성을 함께 검토함. 이용자의 권리와 정보의 신뢰성을 존중하며 책임 있는 정보과학 실천 태도를 발전시킴."}};const $=id=>document.getElementById(id);const names={a:'시작_멘트',b:'본문_멘트',c:'본문_멘트',d:'마무리_멘트'};for(const id of Object.keys(names)){for(const key of Object.keys(D[names[id]])){const opt=document.createElement('option');opt.value=key;opt.textContent=key;$(id).append(opt)}$(id).addEventListener('change',check)}function check(){const duplicate=$('b').value===$('c').value;$('warn').textContent=duplicate?'본문 멘트 ①과 ②는 서로 다른 유형을 선택해야 합니다.':'';return !duplicate}function count(){const t=$('result').value;$('count').textContent=`${[...t].length}자 (공백 포함) / ${new TextEncoder().encode(t).length}바이트`}function generate(){if(!check()){alert('본문 멘트 2개를 서로 다르게 선택하세요.');return}const text=['a','b','c','d'].map(id=>D[names[id]][$(id).value]).join(' ');$('result').value=text;count()}async function copyText(){const text=$('result').value;if(!text.trim())return alert('생성된 문장이 없습니다.');try{await navigator.clipboard.writeText(text);alert('복사했습니다.')}catch(e){$('result').focus();$('result').select();if(document.execCommand('copy'))alert('복사했습니다.');else alert('Ctrl+C로 복사하세요.')}}function saveText(){const text=$('result').value;if(!text.trim())return alert('저장할 문장이 없습니다.');const url=URL.createObjectURL(new Blob(['\ufeff',text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='정보과학_과세특.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function reset(){$('a').selectedIndex=0;$('b').selectedIndex=1;$('c').selectedIndex=2;$('d').selectedIndex=0;generate()}reset();</script></html>
