<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인공지능 기초 과세특 문장 조합기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#1c2b40;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;line-height:1.65}header{background:linear-gradient(110deg,#173a62,#286c9b);color:white;padding:28px 20px}header>div,main{max-width:1080px;margin:auto}h1{margin:0;font-size:27px}header p{margin:6px 0 0}main{padding:22px 16px}.panel{background:#fff;border:1px solid #dce5f0;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 3px 12px #20354d0a}h2{margin:0 0 14px;font-size:20px;color:#16466e}.field{margin:14px 0}label{font-weight:700;display:block;margin-bottom:5px}select,textarea{width:100%;font:inherit;border:1px solid #b7c8da;border-radius:8px;padding:11px;background:#fff;color:#162b44}select:focus,textarea:focus{outline:2px solid #7daed6}textarea{min-height:260px;resize:vertical;line-height:1.9}button{font:inherit;border:1px solid #aac0d5;background:#fff;color:#174a75;padding:10px 15px;border-radius:8px;cursor:pointer}button.primary{background:#1d5686;color:#fff;border-color:#1d5686}button:hover{filter:brightness(.95)}.actions{display:flex;gap:9px;flex-wrap:wrap}.note{font-size:14px;color:#546a80}.status{margin:10px 0;color:#235a84;font-weight:700}.error{color:#b32832}.stats{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;margin:12px 0}.preview{padding:10px 14px;background:#f5f8fc;border-left:3px solid #6395bb;border-radius:4px;min-height:60px;margin-top:7px;white-space:pre-wrap;font-size:14px}.small{font-size:13px;color:#627489}@media(min-width:800px){.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}}@media print{header,.actions,.field,.note{display:none!important}body{background:white}.panel{border:0;box-shadow:none}textarea{border:0;min-height:unset}}
</style></head><body><header><div><h1>인공지능 기초 · 과세특 문장 조합기</h1><p>시작 1개 + 서로 다른 본문 2개 + 마무리 1개 · 웹브라우저에서 바로 실행</p></div></header><main><section class="panel"><h2>문장 선택</h2><div class="two"><div class="field"><label for="start">시작 멘트 (20유형)</label><select id="start"></select><div class="preview" id="startPreview"></div></div><div class="field"><label for="body1">본문 멘트 ① (20유형)</label><select id="body1"></select><div class="preview" id="body1Preview"></div></div><div class="field"><label for="body2">본문 멘트 ② (20유형 · 중복 불가)</label><select id="body2"></select><div class="preview" id="body2Preview"></div></div><div class="field"><label for="end">마무리 멘트 (20유형)</label><select id="end"></select><div class="preview" id="endPreview"></div></div></div><p class="note">본문 ①과 본문 ②는 동일한 번호를 선택할 수 없습니다. 중복 번호는 선택 목록에서 비활성화됩니다.</p><div class="actions"><button class="primary" id="make">문장 생성</button><button id="reset">초기화</button></div><p class="status" id="message" role="status">문장을 선택하고 '문장 생성'을 누르세요.</p></section><section class="panel"><h2>과세특 결과 (직접 수정 가능)</h2><textarea id="result" placeholder="선택한 문장이 이곳에 표시됩니다."></textarea><div class="stats"><span id="withSpace">공백 포함 0자</span><span id="withoutSpace">공백 제외 0자</span></div><div class="actions"><button class="primary" id="copy">결과 복사</button><button id="save">TXT 저장</button><button id="print">인쇄</button></div><p class="small">저장 파일은 UTF-8 BOM 형식으로 만들어 Windows 메모장에서도 한글이 잘 표시됩니다. 작성 내용은 서버에 전송하지 않습니다.</p></section></main><script>
const DATA={"시작_멘트": {"1": "인공지능의 개념과 발전 과정에 관심을 가지고 일상생활 속 활용 사례를 조사하며 기술의 원리를 탐구함.", "2": "인간의 지능과 인공지능의 문제 해결 방식을 비교하며 두 방식의 차이를 논리적으로 분석함.", "3": "생활 속 지능형 서비스를 관찰하고 입력 정보와 처리 결과의 관계를 탐색하는 태도를 보임.", "4": "인공지능 기술의 역사적 발전 과정을 조사하고 시대별 기술 변화의 의미를 정리함.", "5": "지능 에이전트의 환경 인식과 행동 선택 원리를 중심으로 작동 과정을 탐구함.", "6": "학습 자료가 인공지능의 성능에 미치는 영향을 질문으로 설정하고 데이터의 역할을 분석함.", "7": "지도학습과 비지도학습의 차이를 비교하며 문제에 적합한 학습 방법을 탐색함.", "8": "인공지능 모형의 예측 결과에 관심을 가지고 학습과 평가 과정을 체계적으로 살펴봄.", "9": "다양한 자료에서 규칙을 발견하는 학습 원리를 이해하고 분류와 예측 문제를 탐구함.", "10": "자료의 양과 품질에 따른 학습 성능 변화를 관찰하고 검증 가능한 탐구 질문을 설정함.", "11": "인공지능 기술의 사회적 영향을 다각도로 살펴보며 책임 있는 활용의 필요성을 인식함.", "12": "인공지능의 편향과 공정성 문제에 관심을 가지고 판단 결과의 차이를 분석함.", "13": "개인정보 보호와 인공지능 활용 사이의 균형을 주제로 윤리적 쟁점을 탐구함.", "14": "인공지능의 자동화가 직업과 사회에 미치는 변화를 다양한 사례를 통해 조사함.", "15": "인공지능 생성 정보의 신뢰성을 검토하며 인간의 확인과 판단이 필요한 이유를 탐구함.", "16": "생활 속 문제를 인공지능으로 해결할 수 있는 가능성을 발견하고 탐구 목표를 구체화함.", "17": "실생활 문제를 인공지능 학습 과제로 전환하며 필요한 자료와 평가 기준을 분석함.", "18": "인공지능 프로젝트의 단계별 수행 과정을 계획하고 자료 준비와 구현 절차를 탐색함.", "19": "협력적 인공지능 프로젝트에서 공동 목표를 설정하고 해결 방안을 비교하며 참여함.", "20": "인공지능을 활용한 문제 해결 활동에서 결과의 정확성과 활용 가능성을 함께 검토함."}, "본문_멘트": {"1": "규칙 기반 시스템과 학습 기반 시스템의 차이를 조사하고 입력 정보, 처리 과정, 출력 결과를 연결하여 분석함. 여러 활용 사례의 작동 원리를 비교하고 각 방식의 장점과 한계를 정리함. 탐구 내용을 개념도로 구조화하여 데이터와 알고리즘이 수행하는 역할을 설명함.", "2": "자율주행 상황을 가정하고 지능 에이전트가 감지 정보에 따라 행동을 선택하는 절차를 분석함. 장애물과 신호 변화에 대한 대응 규칙을 정리하고 예외 상황에서 발생하는 문제를 검토함. 환경 변화에 대응하기 위한 개선 방안을 제시함.", "3": "의료 영상 분석과 질병 위험 예측 사례를 조사하고 학습 자료의 특성과 판단 결과 사이의 관계를 비교함. 잘못된 예측이 초래할 수 있는 문제를 분석하고 전문가의 최종 판단이 필요한 이유를 설명함. 안전한 활용 조건을 정리함.", "4": "추천 서비스에서 사용자 기록과 선호 정보가 결과에 반영되는 과정을 분석함. 특정 정보가 반복적으로 추천되는 원인을 조사하고 추천의 다양성과 정확성 사이의 관계를 비교함. 이용자의 선택권을 존중하는 개선 방향을 제안함.", "5": "지능형 대화 시스템에 표현이 다른 질문을 입력하고 응답 결과를 비교함. 문맥 변화에 따른 응답 차이와 사실과 다른 정보가 생성되는 사례를 분석함. 출처 확인과 교차 검증 절차를 제안하고 신뢰성 있는 활용 방법을 정리함.", "6": "손글씨 숫자 분류를 주제로 학습 자료와 평가 자료를 구분하여 실험함. 자료의 양과 구성에 따라 분류 결과가 어떻게 달라지는지 비교하고 잘못 분류된 사례의 형태적 특징을 분석함. 학습 자료를 보완하여 성능을 개선할 방법을 제안함.", "7": "꽃의 길이와 너비를 이용하여 품종을 분류하는 지도학습 활동을 수행함. 입력 변수를 선정하고 학습 모형의 예측 결과를 실제 품종과 비교함. 잘못 분류된 사례를 분석하여 변수 선택의 중요성과 성능 평가의 필요성을 설명함.", "8": "주택 면적과 건축 연도 등의 자료로 가격을 예측하는 과정을 탐구함. 결측값과 이상값 처리 방법을 비교하고 예측값과 실제값의 차이를 계산함. 오차가 큰 사례의 특징을 분석하여 입력 변수의 적절성과 예측 모형의 한계를 설명함.", "9": "정답 정보가 없는 자료를 유사성에 따라 묶는 군집화 활동을 수행함. 변수의 크기 차이가 거리 계산에 미치는 영향을 살펴보고 군집 개수를 바꾸어 결과를 시각화함. 각 집단의 공통 특징을 해석하고 군집 구분의 적절성을 검토함.", "10": "학습 자료와 새로운 평가 자료에서 나타나는 성능 차이를 비교하여 과적합 현상을 탐구함. 모형의 복잡도와 학습 조건을 변경하면서 결과를 기록하고 표와 그래프로 분석함. 일반화 성능을 높이기 위한 조건을 근거와 함께 제안함.", "11": "채용 평가에 인공지능을 활용할 때 발생할 수 있는 편향을 사례 중심으로 분석함. 학습 자료의 대표성과 평가 기준이 결과에 미치는 영향을 검토함. 불공정한 판단을 줄이기 위한 자료 점검과 인간의 감독 절차를 제안함.", "12": "얼굴 인식 기술의 정보 수집, 저장, 활용 과정을 조사함. 출입 관리의 편리함과 사생활 침해 위험을 비교하고 동의 없는 정보 활용의 문제를 분석함. 개인정보 최소 수집과 안전한 관리의 필요성을 근거를 들어 설명함.", "13": "인공지능 생성 이미지와 문장의 신뢰성을 판단하는 기준을 탐색함. 실제 자료와 생성 자료를 비교하고 출처가 불명확한 정보의 확산 문제를 조사함. 사실 확인, 출처 표시, 저작권 존중을 포함한 활용 원칙을 제안함.", "14": "인공지능 자동화가 직업 세계에 미치는 영향을 조사함. 반복 업무와 창의적 판단이 필요한 업무를 구분하고 인간과 인공지능의 협력 사례를 비교함. 미래 사회에서 요구되는 역량과 지속적인 학습의 필요성을 정리함.", "15": "자동화된 의사결정이 잘못된 결과를 낳는 사례를 조사하고 개발자, 운영자, 이용자의 역할을 분석함. 판단 과정의 설명 가능성과 결과 검증 절차를 검토함. 중요한 결정에서 인간의 감독이 필요한 조건을 제시함.", "16": "재활용품 이미지 분류 프로젝트를 계획하고 종류별 사진을 수집하여 학습 자료를 구성함. 다양한 조명과 촬영 각도에서 분류 결과를 확인하고 오류 원인을 분석함. 자료를 추가하여 성능 개선을 시도하고 분리배출 안내 방안을 제안함.", "17": "학습 시간과 과제 수행 기록을 활용한 학습 유형 분석 프로젝트를 설계함. 개인정보 보호를 고려하여 자료를 정리하고 유형별 추천 기준을 설정함. 추천 결과의 적절성을 사례로 검증하고 편향을 줄이기 위한 개선 방안을 탐색함.", "18": "기온, 습도, 기압 자료를 활용하여 강수 여부를 예측하는 모형을 구성함. 결측값을 점검하고 입력 변수를 선정한 뒤 실제 관측값과 예측 결과를 비교함. 오차 유형을 분석하고 조건을 바꾸어 성능 변화를 확인함.", "19": "식물 잎의 정상 상태와 이상 증상을 구별하는 이미지 분류 프로젝트를 수행함. 촬영 조건과 자료의 균형을 고려하여 학습 자료를 준비함. 배경과 조명에 따른 분류 오류를 분석하고 자료 보완을 통한 개선 방안을 제시함.", "20": "시간대별 전력 사용량을 정리하여 에너지 소비량 예측 프로젝트를 수행함. 기온과 사용 시간의 영향을 분석하고 예측값과 실제값의 차이를 비교함. 오차가 큰 시간대의 특징을 조사하고 에너지 절약을 위한 실천 방안을 제안함."}, "마무리_멘트": {"1": "인공지능의 원리를 실생활과 연결하여 설명하고 새로운 문제에 적용하는 능력이 돋보임. 기술의 작동 과정을 논리적으로 분석하며 창의적 사고력과 자기주도적 탐구 역량을 발전시킴.", "2": "지능 에이전트의 환경 인식과 의사결정 과정을 체계적으로 이해함. 탐구 과정에서 발견한 의문을 새로운 학습 주제로 확장하며 분석적 사고력과 학문적 호기심을 발휘함.", "3": "인간의 사고와 인공지능의 정보 처리 방식을 비교하여 가능성과 한계를 균형 있게 이해함. 새로운 관점에서 문제를 해석하는 능동적이고 성찰적인 태도가 돋보임.", "4": "인공지능 기술의 발전과 사회적 변화를 연결하여 해석함. 기술적 현상에 대한 질문을 스스로 만들고 근거를 바탕으로 답을 탐색하며 융합적 사고 역량을 발전시킴.", "5": "지능형 시스템의 구성 요소와 상호작용을 체계적으로 설명함. 학습한 개념을 새로운 사례에 적용하고 다양한 해결 가능성을 탐색하는 창의적인 태도를 보여 줌.", "6": "학습 자료의 특성과 모형의 성능 사이의 관계를 분석함. 실험 결과를 객관적으로 비교하고 개선 근거를 제시하며 데이터 기반 문제 해결 역량을 발전시킴.", "7": "지도학습과 비지도학습의 특징을 비교하고 적절한 방법을 선정함. 예측 오류의 원인을 분석하며 합리적 의사결정 능력과 자기주도적 탐구 역량을 보여 줌.", "8": "학습 모형의 구현과 평가 과정을 체계적으로 수행함. 다양한 실험 조건을 비교하여 결과의 신뢰성을 검토하고 분석을 근거로 개선 방안을 도출하는 능력이 돋보임.", "9": "자료의 수집과 전처리가 학습 결과에 미치는 영향을 이해함. 오류 원인을 탐색하고 가설을 검증하는 과정에서 논리적 사고력과 실험 설계 능력을 발전시킴.", "10": "분류와 예측 결과를 비판적으로 해석하고 학습 모형의 한계를 평가함. 결과의 정확성과 학습 과정의 타당성을 함께 검토하는 문제 해결 역량을 보여 줌.", "11": "인공지능의 사회적 영향과 윤리적 쟁점을 다양한 관점에서 분석함. 공정성과 개인정보 보호를 함께 고려하며 책임 있는 기술 활용 태도를 보여 줌.", "12": "인공지능 판단의 편향과 차별 문제를 비판적으로 검토함. 기술적 효율성과 사회적 공정성을 함께 분석하고 합리적인 개선 방향을 제시하는 능력이 돋보임.", "13": "인공지능 활용 과정에서 개인정보 보호와 정보의 신뢰성을 중시함. 편리함과 위험을 균형 있게 검토하며 책임 있는 디지털 시민의 역량을 보여 줌.", "14": "인공지능이 미래 사회와 직업 세계에 미치는 변화를 폭넓게 이해함. 인간과 기술의 협력 가능성을 탐색하고 지속 가능한 활용 방향을 모색하는 태도가 돋보임.", "15": "인공지능의 판단 근거와 책임 소재를 비판적으로 검토함. 기술의 한계를 인식하고 인간의 존엄성과 공동체의 가치를 존중하는 윤리적 성찰 역량을 보여 줌.", "16": "실생활 문제 해결 과정에서 창의적 발상과 체계적 실행 능력을 발휘함. 탐구 결과를 검증하고 발견한 한계를 개선 과제로 연결하며 자기주도적 역량을 발전시킴.", "17": "프로젝트의 목표 설정부터 구현과 평가까지 체계적으로 수행함. 예상하지 못한 문제에도 여러 해결 방법을 탐색하고 반복적으로 개선하는 도전적인 태도가 돋보임.", "18": "학습 결과를 바탕으로 해결 방안의 실효성을 검토하고 활용 가능성을 탐색함. 탐구 경험을 후속 연구로 확장하며 창의적이고 융합적인 사고 역량을 발전시킴.", "19": "협력적 프로젝트에서 구성원의 의견을 존중하고 해결 방안을 조율함. 공동 목표를 위해 맡은 역할을 책임감 있게 수행하며 협업과 의사소통 역량을 발전시킴.", "20": "프로젝트 오류의 원인을 분석하고 해결 과정을 반복적으로 개선함. 성과와 한계를 성찰하고 새로운 문제에 도전하는 지속적인 성장 가능성을 보여 줌."}};
const config={start:'시작_멘트',body1:'본문_멘트',body2:'본문_멘트',end:'마무리_멘트'};
const $=id=>document.getElementById(id);
for(const [id,key] of Object.entries(config)){for(const [n,s] of Object.entries(DATA[key])){const o=document.createElement('option');o.value=n;o.textContent=n.padStart(2,'0')+'. '+s.slice(0,46)+(s.length>46?'…':'');$(id).append(o);}}
$('start').value='1';$('body1').value='2';$('body2').value='3';$('end').value='1';
function update(){for(const id of Object.keys(config))$(id+'Preview').textContent=DATA[config[id]][$(id).value];for(const id of ['body1','body2']){const other=id==='body1'?'body2':'body1';for(const o of $(id).options)o.disabled=o.value===$(other).value;}const conflict=$('body1').value===$('body2').value;$('make').disabled=conflict;$('message').textContent=conflict?'본문 멘트 ①과 ②는 서로 달라야 합니다.':'문장을 선택하고 문장 생성을 누르세요.';$('message').classList.toggle('error',conflict);}
for(const id of Object.keys(config))$(id).addEventListener('change',update);
function counts(){const s=$('result').value;$('withSpace').textContent='공백 포함 '+s.length+'자';$('withoutSpace').textContent='공백 제외 '+s.replace(/\s/g,'').length+'자';}
$('result').addEventListener('input',counts);
$('make').addEventListener('click',()=>{if($('body1').value===$('body2').value){alert('본문 멘트는 서로 다른 번호를 선택해야 합니다.');return;}const s=Object.keys(config).map(id=>DATA[config[id]][$(id).value]).join(' ');$('result').value=s;counts();$('message').textContent='문장 생성 완료 · 결과를 직접 수정할 수 있습니다.';});
$('reset').addEventListener('click',()=>{$('start').value='1';$('body1').value='2';$('body2').value='3';$('end').value='1';$('result').value='';counts();update();$('message').textContent='초기화되었습니다.';});
$('copy').addEventListener('click',async()=>{const s=$('result').value.trim();if(!s){alert('먼저 문장을 생성하세요.');return;}try{await navigator.clipboard.writeText(s);}catch(e){$('result').focus();$('result').select();document.execCommand('copy');} $('message').textContent='결과를 복사했습니다.';});
$('save').addEventListener('click',()=>{const s=$('result').value.trim();if(!s){alert('먼저 문장을 생성하세요.');return;}const blob=new Blob(['\uFEFF',s],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);const d=new Date(),p=n=>String(n).padStart(2,'0');a.download=`인공지능기초_과세특_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.txt`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
$('print').addEventListener('click',()=>window.print());update();counts();
</script></body></html>
